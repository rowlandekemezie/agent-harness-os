name: Bootstrap Codex subscription worker

on:
  push:
    branches:
      - feature/codex-subscription-worker

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'chore: stage codex subscription worker patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed patch
        run: node scripts/apply-codex-subscription-worker.mjs
      - name: Validate release tree
        run: |
          npm ci --ignore-scripts
          npm run check
          npm pack --dry-run --ignore-scripts
          git diff --check
      - name: Commit release tree
        run: |
          git rm scripts/apply-codex-subscription-worker.mjs .github/workflows/bootstrap-codex-subscription-worker.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add ChatGPT subscription-backed Codex worker'
          git push origin HEAD:feature/codex-subscription-worker
