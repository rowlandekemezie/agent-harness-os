name: Apply verified Codex worker patch

on:
  push:
    branches:
      - feature/codex-subscription-worker-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply verified codex worker patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-os-bootstrap/chunk-* > /tmp/codex-worker.patch.xz.b64
          echo '7207f738fc3bf3b58cbb8da9e3f6bd5ce4e50100f08645c08d878a39b4b25204  /tmp/codex-worker.patch.xz.b64' | sha256sum -c -
          base64 --decode /tmp/codex-worker.patch.xz.b64 > /tmp/codex-worker.patch.xz
          echo '30b5fd83a63b81dbe6174245c5f5a3645a5322b5dff907066d53ce72f9058f04  /tmp/codex-worker.patch.xz' | sha256sum -c -
          xz --test /tmp/codex-worker.patch.xz
          xz --decompress --stdout /tmp/codex-worker.patch.xz > /tmp/codex-worker.patch
          git apply --check /tmp/codex-worker.patch
          git apply /tmp/codex-worker.patch
      - name: Remove transfer-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent-os-bootstrap
          rm -f .github/workflows/bootstrap-codex-worker.yml
      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm pack --dry-run --ignore-scripts
          git diff --check
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add ChatGPT-authenticated Codex worker adapter'
          git push origin HEAD:feature/codex-subscription-worker-v2
