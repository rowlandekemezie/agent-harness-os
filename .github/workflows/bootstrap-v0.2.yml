name: Bootstrap Agent OS v0.2

on:
  push:
    branches:
      - feature/model-agnostic-worker-registry

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Restore reviewed release tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-os-bootstrap"
          cp .agent-os-bootstrap/chunk-* "$RUNNER_TEMP/agent-os-bootstrap/"
          cat "$RUNNER_TEMP"/agent-os-bootstrap/chunk-* > "$RUNNER_TEMP/agent-os-v0.2.0.tar.xz"
          echo '360495e8e08f7313e1caa5e51b953bebdd170ed739e93907eee05186af47dfbc  '"$RUNNER_TEMP/agent-os-v0.2.0.tar.xz" | sha256sum -c -
          xz -t "$RUNNER_TEMP/agent-os-v0.2.0.tar.xz"
          git rm -rf .
          tar -xJf "$RUNNER_TEMP/agent-os-v0.2.0.tar.xz" -C .
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add model-agnostic worker registry and routing'
          git push origin HEAD:feature/model-agnostic-worker-registry
