name: Harden Codex worker tool isolation

on:
  push:
    branches:
      - feature/codex-subscription-worker-v2

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'chore: harden codex worker tool isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Restrict nested Codex built-in tools
        shell: python
        run: |
          from pathlib import Path

          provider = Path('src/provider/codex-cli.ts')
          source = provider.read_text()
          old = "\t\t\t\t'--ignore-user-config',\n\t\t\t\t'--ignore-rules',\n\t\t\t\t'--skip-git-repo-check',"
          new = "\t\t\t\t'--ignore-user-config',\n\t\t\t\t'--ignore-rules',\n\t\t\t\t'--disable',\n\t\t\t\t'shell_tool',\n\t\t\t\t'--disable',\n\t\t\t\t'unified_exec',\n\t\t\t\t'--disable',\n\t\t\t\t'shell_snapshot',\n\t\t\t\t'--disable',\n\t\t\t\t'code_mode',\n\t\t\t\t'--disable',\n\t\t\t\t'code_mode_only',\n\t\t\t\t'--skip-git-repo-check',"
          if source.count(old) != 1:
              raise SystemExit('unexpected codex exec argument shape')
          provider.write_text(source.replace(old, new))

          tests = Path('test/unit/codex-cli-provider.test.ts')
          source = tests.read_text()
          old = "\t\tassert.equal(invocation.args.includes('--ignore-rules'), true)\n\t\tassert.equal(invocation.args.includes('--skip-git-repo-check'), true)"
          new = "\t\tassert.equal(invocation.args.includes('--ignore-rules'), true)\n\t\tfor (const feature of [\n\t\t\t'shell_tool',\n\t\t\t'unified_exec',\n\t\t\t'shell_snapshot',\n\t\t\t'code_mode',\n\t\t\t'code_mode_only',\n\t\t]) {\n\t\t\tconst featureIndex = invocation.args.indexOf(feature)\n\t\t\tassert.ok(featureIndex > 0)\n\t\t\tassert.equal(invocation.args[featureIndex - 1], '--disable')\n\t\t}\n\t\tassert.equal(invocation.args.includes('--skip-git-repo-check'), true)"
          if source.count(old) != 1:
              raise SystemExit('unexpected codex provider test shape')
          tests.write_text(source.replace(old, new))

          threat = Path('docs/threat-model.md')
          source = threat.read_text()
          old = "- `codex exec` is invoked ephemerally with a read-only sandbox, approvals disabled, user config/rules disabled, and structured output validation\n- Repository context is supplied only through the bounded conversation and Agent OS tool definitions; repository file authority remains in `WorkerToolExecutor`"
          new = "- `codex exec` is invoked ephemerally with a read-only sandbox, approvals disabled, user config/rules disabled, and structured output validation\n- Built-in shell, unified exec, shell snapshot, and code-mode execution features are explicitly disabled so the nested Codex turn cannot use its own execution tools to inspect the host\n- Repository context is supplied only through the bounded conversation and Agent OS tool definitions; repository file authority remains in `WorkerToolExecutor`"
          if source.count(old) != 1:
              raise SystemExit('unexpected threat model shape')
          threat.write_text(source.replace(old, new))
      - name: Validate
        run: |
          npm ci --ignore-scripts
          npm run check
          npm pack --dry-run --ignore-scripts
          git diff --check
      - name: Commit hardening
        run: |
          git rm .github/workflows/harden-codex-worker-tools.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: disable built-in tools for Codex workers'
          git push origin HEAD:feature/codex-subscription-worker-v2
