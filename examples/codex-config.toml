[mcp_servers.agent_os]
command = "node"
args = ["/absolute/path/to/agent-harness-os/dist/src/cli.js", "mcp"]
env_vars = ["AGENT_HARNESS_ALLOW_UNSANDBOXED_LOCAL", "AGENT_HARNESS_ALLOWED_COMMANDS", "AGENT_HARNESS_ARTIFACT_ROOT", "AGENT_HARNESS_COMMAND_TIMEOUT_MS", "AGENT_HARNESS_DOCKER_IMAGE", "AGENT_HARNESS_DOCKER_NETWORK", "AGENT_HARNESS_EXECUTION_BACKEND", "AGENT_HARNESS_LOG_LEVEL", "AGENT_HARNESS_MAX_CHANGED_FILES", "AGENT_HARNESS_MAX_CONCURRENCY", "AGENT_HARNESS_MAX_FILE_BYTES", "AGENT_HARNESS_MAX_MCP_IN_FLIGHT", "AGENT_HARNESS_MAX_MCP_MESSAGE_BYTES", "AGENT_HARNESS_MAX_PROVIDER_CONTEXT_BYTES", "AGENT_HARNESS_MAX_SEARCH_BYTES", "AGENT_HARNESS_MAX_TOOL_OUTPUT_BYTES", "AGENT_HARNESS_MAX_TOTAL_TOOL_CALLS", "AGENT_HARNESS_MAX_TRAVERSAL_ENTRIES", "AGENT_HARNESS_REQUIRE_PINNED_DOCKER_IMAGE", "AGENT_OS_DEFAULT_WORKER", "AGENT_OS_MAX_WORKER_ATTEMPTS", "AGENT_OS_ROUTING_STRATEGY", "AGENT_OS_WORKERS_JSON", "ANTHROPIC_API_KEY", "GEMINI_API_KEY", "OPENAI_API_KEY", "OPENROUTER_API_KEY", "QWEN_ALLOW_INSECURE_HTTP", "QWEN_API_KEY", "QWEN_BASE_URL", "QWEN_CHAT_COMPLETIONS_URL", "QWEN_HEADERS_JSON", "QWEN_MAX_RESPONSE_BYTES", "QWEN_MAX_RETRIES", "QWEN_MODEL", "QWEN_TIMEOUT_MS"]
startup_timeout_sec = 20
tool_timeout_sec = 3600
required = true
default_tools_approval_mode = "writes"

[mcp_servers.agent_os.tools.health_check]
approval_mode = "approve"

[mcp_servers.agent_os.tools.list_workers]
approval_mode = "approve"

[mcp_servers.agent_os.tools.route_worker]
approval_mode = "approve"

[mcp_servers.agent_os.tools.get_worker_run]
approval_mode = "approve"

[mcp_servers.agent_os.tools.delegate_to_worker]
approval_mode = "prompt"

[mcp_servers.agent_os.tools.apply_worker_patch]
approval_mode = "prompt"
